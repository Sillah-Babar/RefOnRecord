[program:refonrecord-reminder]
; ── Reminder / Expiry Microservice ───────────────────────────────────────────
command=/home/azureuser/refonrecord/env/bin/python -c "
from dotenv import load_dotenv; load_dotenv('/home/azureuser/refonrecord/.env');
exec(open('service.py').read())
"

directory=/home/azureuser/refonrecord/reminder_service
user=azureuser
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

stdout_logfile=/var/log/refonrecord/reminder.log
stderr_logfile=/var/log/refonrecord/reminder.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
