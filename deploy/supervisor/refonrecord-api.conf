[program:refonrecord-api]
; ── Gunicorn / Flask API ─────────────────────────────────────────────────────
command=/home/azureuser/refonrecord/env/bin/gunicorn
    --workers 3
    --bind 127.0.0.1:5000
    --timeout 120
    --access-logfile /var/log/refonrecord/api-access.log
    --error-logfile  /var/log/refonrecord/api-error.log
    "resumeverifier:create_app()"

directory=/home/azureuser/refonrecord
user=azureuser
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

; Load the production .env file
environment=FLASK_ENV="production"

; Write supervisor's own stdout/stderr
stdout_logfile=/var/log/refonrecord/api-supervisor.log
stderr_logfile=/var/log/refonrecord/api-supervisor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
