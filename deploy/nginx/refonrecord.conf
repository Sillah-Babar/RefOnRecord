##############################################################################
# RefOnRecord — Nginx configuration
#
# Roles:
#   1. Forward all /api/* requests to Gunicorn on 127.0.0.1:5000
#   2. Serve Swagger UI static files at /docs/
#   3. Serve the openapi.yaml spec at /openapi.yaml
#
# Place this file at:  /etc/nginx/sites-available/refonrecord
# Enable with:         sudo ln -s /etc/nginx/sites-available/refonrecord \
#                                 /etc/nginx/sites-enabled/refonrecord
##############################################################################

server {
    listen 8080;
    server_name _;          # replace with your VM public IP or domain name

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options        SAMEORIGIN;
    add_header X-XSS-Protection       "1; mode=block";

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/refonrecord-access.log;
    error_log  /var/log/nginx/refonrecord-error.log;

    # ── Swagger UI (static files) ─────────────────────────────────────────────
    # Served directly by Nginx — no app server needed for static content.
    location /docs/ {
        alias /home/azureuser/refonrecord/deploy/swagger-ui/;
        index index.html;
    }

    # ── OpenAPI spec ──────────────────────────────────────────────────────────
    location /openapi.yaml {
        alias /home/azureuser/refonrecord/openapi.yaml;
        add_header Content-Type "application/yaml";
        add_header Access-Control-Allow-Origin "*";
    }

    # ── Flask API (proxied to Gunicorn) ───────────────────────────────────────
    location /api/ {
        # CORS — allow Swagger UI and browsers to call the API
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key" always;

        # Handle preflight requests without hitting Gunicorn
        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # Pass large request bodies (e.g. education_details)
        client_max_body_size 1M;
    }

    # ── Root redirect → docs ──────────────────────────────────────────────────
    location = / {
        return 301 /docs/;
    }
}
