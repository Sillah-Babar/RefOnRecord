                    company_name: "Acme Corp"
                    position_title: "Senior Software Engineer"
                    start_date: "2022-06-01"
                    end_date: null
                    description: "Developed and maintained backend microservices."
                    verification_status: verified
                    created_at: "2026-01-20T09:05:00"
                    updated_at: "2026-02-10T11:00:00"
                    links:
                      self: "/api/users/1/projects/42/experiences/7/"
                      project: "/api/users/1/projects/42/"
                      verification_requests: "/api/users/1/projects/42/experiences/7/verification-requests/"
                share:
                  share_id: 10
                  project_id: 42
                  share_token: "f9e8d7c6b5a4f9e8d7c6b5a4f9e8d7c6"
                  recipient_email: "recruiter@company.com"
                  access_type: view
                  email_subject: "My Resume"
                  email_message: null
                  view_count: 4
                  created_at: "2026-03-10T12:00:00"
                  expires_at: null
                  links:
                    self: "/api/shares/f9e8d7c6b5a4f9e8d7c6b5a4f9e8d7c6/"
                    project: "/api/users/1/projects/42/"
        "404":
          description: Share link not found or expired
          content:
