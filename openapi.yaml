openapi: 3.0.3
info:
  title: RefOnRecord – Resume Verifier API
  description: >
    API for managing resume projects, work experiences, and verification requests.
    Verifiers can be emailed to confirm or reject employment history.
  version: "1.0.0"
  contact:
    name: PWP Spring 2026 Group
    email: Sillah.Babar@student.oulu.fi

servers:
  - url: https://refonrecord.onrender.com/api
    description: Production
  - url: http://localhost:5000/api
    description: Local development

security: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: UUID

  responses:
    BadRequest:
      description: Invalid request body or validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid, or expired bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated user is not the owner of this resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Duplicate resource (e.g. email or username already in use)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    User:
      type: object
      properties:
        user_id:
          type: integer
        email:
          type: string
          format: email
        username:
          type: string
        phone_number:
          type: string
          nullable: true
        tier:
          type: string
          enum: [normal, premium]
        created_at:
          type: string
          format: date-time
        links:
          type: object
          properties:
            self:
              type: string
            projects:
              type: string

    Project:
      type: object
      properties:
        project_id:
          type: integer
        user_id:
          type: integer
        project_name:
          type: string
        template_style:
          type: string
          enum: [classic, modern, minimal]
        phone_number:
          type: string
          nullable: true
        linkedin_url:
          type: string
          nullable: true
        github_url:
          type: string
          nullable: true
        personal_website:
          type: string
          nullable: true
        current_company:
          type: string
          nullable: true
        is_employed:
          type: boolean
        education_details:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        links:
          type: object
          properties:
            self:
              type: string
            owner:
              type: string
            experiences:
              type: string
            shares:
              type: string

    Experience:
      type: object
      properties:
        experience_id:
          type: integer
        project_id:
          type: integer
        company_name:
          type: string
        position_title:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        description:
          type: string
        verification_status:
          type: string
          enum: [not_requested, pending, verified, rejected]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        links:
          type: object
          properties:
            self:
              type: string
            project:
              type: string
            verification_requests:
              type: string

    VerificationRequest:
      type: object
      properties:
        request_id:
          type: integer
        experience_id:
          type: integer
        verifier_name:
          type: string
        verifier_position:
          type: string
        verifier_email:
          type: string
          format: email
        verification_token:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, verified, rejected, expired]
        verifier_comment:
          type: string
          nullable: true
        requested_at:
          type: string
          format: date-time
        responded_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
        links:
          type: object
          properties:
            self:
              type: string
            experience:
              type: string
            respond:
              type: string

    ShareLink:
      type: object
      properties:
        share_id:
          type: integer
        project_id:
          type: integer
        share_token:
          type: string
          format: uuid
        recipient_email:
          type: string
          format: email
          nullable: true
        access_type:
          type: string
          enum: [view, edit]
        email_subject:
          type: string
          nullable: true
        email_message:
          type: string
          nullable: true
        view_count:
          type: integer
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        links:
          type: object
          properties:
            self:
              type: string
            project:
              type: string

paths:
  # ── Authentication ──────────────────────────────────────────────────────────

  /auth/login/:
    post:
      tags: [Auth]
      summary: Login and obtain a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
            example:
              email: user@example.com
              password: secret123
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    format: uuid
                  user_id:
                    type: integer
                  expires_at:
                    type: string
                    format: date-time
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout/:
    delete:
      tags: [Auth]
      summary: Logout and invalidate the current bearer token
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Logged out successfully
        "401":
          description: Missing, invalid, or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Users ───────────────────────────────────────────────────────────────────

  /users/:
    post:
      tags: [Users]
      summary: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, password]
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                username:
                  type: string
                  minLength: 3
                  maxLength: 100
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                phone_number:
                  type: string
                  maxLength: 20
                tier:
                  type: string
                  enum: [normal, premium]
            example:
              email: user@example.com
              username: johndoe
              password: securepass1
      responses:
        "201":
          description: User created
          headers:
            Location:
              schema:
                type: string
              description: URL of the created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email or username already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{user_id}/:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Users]
      summary: Get a user profile (owner only)

      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Users]
      summary: Update a user profile (owner only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                username:
                  type: string
                  minLength: 3
                  maxLength: 100
                phone_number:
                  type: string
                  maxLength: 20
                tier:
                  type: string
                  enum: [normal, premium]
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Users]
      summary: Delete a user account and all associated data (owner only)
      security:
        - BearerAuth: []
      responses:
        "204":
          description: User deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Projects ─────────────────────────────────────────────────────────────────

  /users/{user_id}/projects/:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Projects]
      summary: List all projects for a user (owner only, cached 300s)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Projects]
      summary: Create a new resume project (owner only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_name]
              additionalProperties: false
              properties:
                project_name:
                  type: string
                  minLength: 1
                  maxLength: 200
                template_style:
                  type: string
                  enum: [classic, modern, minimal]
                phone_number:
                  type: string
                  maxLength: 20
                linkedin_url:
                  type: string
                  maxLength: 500
                github_url:
                  type: string
                  maxLength: 500
                personal_website:
                  type: string
                  maxLength: 500
                current_company:
                  type: string
                  maxLength: 200
                is_employed:
                  type: boolean
                education_details:
                  type: string
      responses:
        "201":
          description: Project created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{user_id}/projects/{project_id}/:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Projects]
      summary: Get a single project (owner only, cached 300s)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Projects]
      summary: Update a project (owner only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                project_name:
                  type: string
                  minLength: 1
                  maxLength: 200
                template_style:
                  type: string
                  enum: [classic, modern, minimal]
                phone_number:
                  type: string
                  maxLength: 20
                linkedin_url:
                  type: string
                  maxLength: 500
                github_url:
                  type: string
                  maxLength: 500
                personal_website:
                  type: string
                  maxLength: 500
                current_company:
                  type: string
                  maxLength: 200
                is_employed:
                  type: boolean
                education_details:
                  type: string
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Projects]
      summary: Delete a project and all associated data (owner only)
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Project deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Experiences ──────────────────────────────────────────────────────────────

  /users/{user_id}/projects/{project_id}/experiences/:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Experiences]
      summary: List all experiences in a project (owner only, cached 300s)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of experiences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Experience"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Experiences]
      summary: Create a work experience entry (owner only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_name, position_title, start_date, description]
              additionalProperties: false
              properties:
                company_name:
                  type: string
                  minLength: 1
                  maxLength: 200
                position_title:
                  type: string
                  minLength: 1
                  maxLength: 200
                start_date:
                  type: string
                  format: date
                end_date:
                  type: string
                  format: date
                  nullable: true
                  description: Must be >= start_date if provided
                description:
                  type: string
                  minLength: 1
      responses:
        "201":
          description: Experience created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experience"
        "400":
          description: Validation error or end_date before start_date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{user_id}/projects/{project_id}/experiences/{experience_id}/:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
      - name: experience_id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Experiences]
      summary: Get a single experience (owner only, cached 300s)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Experience
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experience"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Experiences]
      summary: Update an experience (owner only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                company_name:
                  type: string
                  minLength: 1
                  maxLength: 200
                position_title:
                  type: string
                  minLength: 1
                  maxLength: 200
                start_date:
                  type: string
                  format: date
                end_date:
                  type: string
                  format: date
                  nullable: true
                description:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Updated experience
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experience"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Experiences]
      summary: Delete an experience (owner only)
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Experience deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Verification Requests ────────────────────────────────────────────────────

  /users/{user_id}/projects/{project_id}/experiences/{experience_id}/verification-requests/:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
      - name: experience_id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Verification]
      summary: List all verification requests for an experience (owner only)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of verification requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VerificationRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Verification]
      summary: Create a verification request and email the verifier (owner only)
      description: >
        Sends an email to the verifier with a link to confirm or reject the
        experience. Token expires after 30 days. Sets experience
        `verification_status` to "pending".
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verifier_name, verifier_position, verifier_email]
              additionalProperties: false
              properties:
                verifier_name:
                  type: string
                  minLength: 1
                  maxLength: 200
                verifier_position:
                  type: string
                  minLength: 1
                  maxLength: 200
                verifier_email:
                  type: string
                  format: email
                  maxLength: 255
      responses:
        "201":
          description: Verification request created and email sent
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{user_id}/projects/{project_id}/experiences/{experience_id}/verification-requests/{request_id}/:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
      - name: experience_id
        in: path
        required: true
        schema:
          type: integer
      - name: request_id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Verification]
      summary: Get a single verification request (owner only)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Verification request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /verification-requests/{request_id}/respond/:
    parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: integer
    post:
      tags: [Verification]
      summary: Submit a verifier response (public — no login required)
      description: >
        The verifier submits the `verification_token` (from their email link)
        along with "verified" or "rejected". Updates the associated experience
        `verification_status` accordingly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verification_token, status]
              additionalProperties: false
              properties:
                verification_token:
                  type: string
                  format: uuid
                status:
                  type: string
                  enum: [verified, rejected]
                verifier_comment:
                  type: string
      responses:
        "200":
          description: Response recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationRequest"
        "400":
          description: Invalid token, expired token, or already responded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Share Links ──────────────────────────────────────────────────────────────

  /users/{user_id}/projects/{project_id}/shares/:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Shares]
      summary: List all share links for a project (owner only)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of share links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShareLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Shares]
      summary: Create a share link for a project (owner only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                recipient_email:
                  type: string
                  format: email
                  maxLength: 255
                access_type:
                  type: string
                  enum: [view, edit]
                  default: view
                email_subject:
                  type: string
                  maxLength: 500
                email_message:
                  type: string
                expires_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Omit or set null for a permanent link
      responses:
        "201":
          description: Share link created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLink"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /shares/{share_token}/:
    parameters:
      - name: share_token
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Shares]
      summary: View a shared resume (public — no login required, cached 300s)
      description: Increments the share link's `view_count` on each access.
      responses:
        "200":
          description: Shared resume data
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
                  experiences:
                    type: array
                    items:
                      $ref: "#/components/schemas/Experience"
                  share:
                    $ref: "#/components/schemas/ShareLink"
        "404":
          description: Share link not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{user_id}/projects/{project_id}/shares/{share_id}/:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
      - name: share_id
        in: path
        required: true
        schema:
          type: integer
    delete:
      tags: [Shares]
      summary: Delete a share link (owner only)
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Share link deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"


tags:
  - name: Auth
    description: Login and logout
  - name: Users
    description: User registration and profile management
  - name: Projects
    description: Resume project CRUD
  - name: Experiences
    description: Work experience entries within a project
  - name: Verification
    description: Request and respond to employment verifications
  - name: Shares
    description: Create and manage public share links for projects
