        example: 3
    get:
      tags: [Verification M2M]
      summary: Get a single verification request with full context (M2M API key required)
      description: >
        Returns verifier details, experience info, and project owner name so
        the caller (e.g. reminder service) can compose emails without extra API
        calls. Requires `X-API-Key` header.
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Verification request with embedded context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationRequestWithContext"
              example:
                request_id: 3
                experience_id: 7
                verifier_name: "Jane Smith"
                verifier_position: "Engineering Manager"
                verifier_email: "jane.smith@acme.com"
                verification_token: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
                status: pending
                verifier_comment: null
                requested_at: "2026-02-01T08:00:00"
                responded_at: null
                expires_at: "2026-03-03T08:00:00"
                links:
                  self: "/api/users/1/projects/42/experiences/7/verification-requests/3/"
                  experience: "/api/users/1/projects/42/experiences/7/"
                  respond: "/api/verification-requests/3/respond/"
                context:
                  company_name: "Acme Corp"
                  position_title: "Senior Software Engineer"
                  requester_username: "johndoe"
                  project_id: 42
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Verification M2M]
      summary: Mark a pending verification request as expired (M2M API key required)
      description: >
        Only accepts `{"status": "expired"}`. Resets the parent experience's
        `verification_status` to "not_requested" so the resume owner can send
        a fresh request. Requires `X-API-Key` header.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status:
                  type: string
                  enum: [expired]
            example:
              status: expired
      responses:
        "200":
          description: Request marked as expired — returns the updated record with context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationRequestWithContext"
              example:
                request_id: 4
                experience_id: 7
                verifier_name: "Bob Jones"
                verifier_position: "CTO"
                verifier_email: "bob@acme.com"
                verification_token: "b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5"
                status: expired
                verifier_comment: null
                requested_at: "2026-03-01T09:00:00"
                responded_at: null
                expires_at: "2026-03-31T09:00:00"
                links:
                  self: "/api/users/1/projects/42/experiences/7/verification-requests/4/"
                  experience: "/api/users/1/projects/42/experiences/7/"
                  respond: "/api/verification-requests/4/respond/"
                context:
                  company_name: "Acme Corp"
                  position_title: "Senior Software Engineer"
                  requester_username: "johndoe"
                  project_id: 42
        "400":
          description: Request is not in pending status or invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Request already has status 'verified'"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Share Links ──────────────────────────────────────────────────────────────

  /users/{user_id}/projects/{project_id}/shares/:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
        example: 1
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
        example: 42
    get:
      tags: [Shares]
      summary: List all share links for a project (owner only)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of share links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShareLink"
              examples:
                with_shares:
                  summary: Project with one permanent and one expiring share
                  value:
                    - share_id: 10
                      project_id: 42
                      share_token: "f9e8d7c6b5a4f9e8d7c6b5a4f9e8d7c6"
                      recipient_email: "recruiter@company.com"
                      access_type: view
                      email_subject: "My Resume"
                      email_message: null
                      view_count: 3
                      created_at: "2026-03-10T12:00:00"
                      expires_at: null
                      links:
                        self: "/api/shares/f9e8d7c6b5a4f9e8d7c6b5a4f9e8d7c6/"
                        project: "/api/users/1/projects/42/"
                    - share_id: 11
                      project_id: 42
                      share_token: "e8d7c6b5a4f3e8d7c6b5a4f3e8d7c6b5"
                      recipient_email: null
                      access_type: view
                      email_subject: null
                      email_message: null
                      view_count: 0
                      created_at: "2026-04-01T08:00:00"
                      expires_at: "2026-07-01T08:00:00"
                      links:
                        self: "/api/shares/e8d7c6b5a4f3e8d7c6b5a4f3e8d7c6b5/"
                        project: "/api/users/1/projects/42/"
                empty:
                  summary: No share links yet
                  value: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Shares]
      summary: Create a share link for a project (owner only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                recipient_email:
                  type: string
                  format: email
                  maxLength: 255
                access_type:
                  type: string
                  enum: [view, edit]
                  default: view
                email_subject:
                  type: string
                  maxLength: 500
                email_message:
                  type: string
                expires_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Omit or set null for a permanent link
            examples:
              with_recipient:
                summary: Share sent to a specific recruiter with expiry
                value:
                  recipient_email: "recruiter@company.com"
                  access_type: view
                  email_subject: "My Software Engineering Resume"
                  expires_at: "2026-07-01T00:00:00"
              permanent_anonymous:
                summary: Permanent anonymous share link (no expiry, no email)
                value:
                  access_type: view
      responses:
        "201":
          description: Share link created
          headers:
            Location:
              schema:
                type: string
              description: Public URL of the created share link
              example: "/api/shares/f9e8d7c6b5a4f9e8d7c6b5a4f9e8d7c6/"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLink"
              example:
                share_id: 10
                project_id: 42
                share_token: "f9e8d7c6b5a4f9e8d7c6b5a4f9e8d7c6"
                recipient_email: "recruiter@company.com"
                access_type: view
                email_subject: "My Software Engineering Resume"
                email_message: null
                view_count: 0
                created_at: "2026-04-05T12:00:00"
                expires_at: "2026-07-01T00:00:00"
                links:
                  self: "/api/shares/f9e8d7c6b5a4f9e8d7c6b5a4f9e8d7c6/"
                  project: "/api/users/1/projects/42/"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

