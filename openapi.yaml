  /verification-requests/{request_id}/respond/:
    parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: integer
        example: 3
    post:
      tags: [Verification]
      summary: Submit a verifier response (M2M API key required)
      description: >
        The verifier submits the `verification_token` (from their email link)
        along with "verified" or "rejected". Validates the token, checks the
        request is still pending and not expired, then updates the associated
        experience `verification_status` accordingly.
        Requires a valid `X-API-Key` header.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verification_token, status]
              additionalProperties: false
              properties:
                verification_token:
                  type: string
                  description: The hex token from the verification email
                  example: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
                status:
                  type: string
                  enum: [verified, rejected]
                verifier_comment:
                  type: string
                  example: "Confirmed — John worked on our platform team."
            examples:
              verified:
                summary: Verifier confirms the employment
                value:
                  verification_token: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
                  status: verified
                  verifier_comment: "Confirmed — John worked on our platform team."
              rejected:
                summary: Verifier rejects the employment claim
                value:
                  verification_token: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
                  status: rejected
                  verifier_comment: "Cannot confirm this employment record."
      responses:
        "200":
          description: Response recorded — returns the updated verification request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationRequest"
              example:
                request_id: 3
                experience_id: 7
                verifier_name: "Jane Smith"
                verifier_position: "Engineering Manager"
                verifier_email: "jane.smith@acme.com"
                verification_token: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
                status: verified
                verifier_comment: "Confirmed — John worked on our platform team."
                requested_at: "2026-02-01T08:00:00"
                responded_at: "2026-02-03T10:15:00"
                expires_at: "2026-03-03T08:00:00"
                links:
                  self: "/api/users/1/projects/42/experiences/7/verification-requests/3/"
                  experience: "/api/users/1/projects/42/experiences/7/"
                  respond: "/api/verification-requests/3/respond/"
        "400":
          description: Invalid token, expired token, or request already responded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid_token:
                  summary: Wrong token
                  value:
                    error: "Invalid verification token"
                expired:
                  summary: Token has expired
                  value:
                    error: "Verification token has expired"
                already_responded:
                  summary: Request already has a final status
                  value:
                    error: "Request already has status 'verified'"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /verify/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        example: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
      - name: action
        in: query
        required: false
        schema:
          type: string
          enum: [verified, rejected]
          default: verified
        description: The verifier's decision. Defaults to "verified".
        example: verified
    get:
      tags: [Verification]
      summary: Email link handler — verifier clicks to confirm or reject (public)
      description: >
        This endpoint is linked directly in the verification email sent to
        verifiers. The verifier clicks the link to confirm (`action=verified`)
        or reject (`action=rejected`) without needing a login. On success it
        returns an HTML confirmation page. On error it returns JSON.
      responses:
        "200":
          description: >
            Decision recorded. Returns an HTML page (not JSON) showing a
            success or rejection confirmation card.
          content:
            text/html:
              schema:
                type: string
              example: |
                <!DOCTYPE html><html><body><h1>Verification Confirmed</h1></body></html>
        "400":
          description: Token expired, already responded, or invalid action value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                expired:
                  value:
                    error: "Verification token has expired"
                already_responded:
                  value:
                    error: "Request already has status 'verified'"
                bad_action:
                  value:
                    error: "action must be 'verified' or 'rejected'"
        "404":
          description: Token not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Verification token not found"

  # ── M2M Verification Requests ────────────────────────────────────────────────

  /verification-requests/:
    get:
      tags: [Verification M2M]
      summary: List verification requests with optional filters (M2M API key required)
      description: >
        Internal endpoint for automated services (e.g. reminder service).
        Returns all verification requests, optionally filtered by status,
        age, or expiry. Each result includes embedded experience and project
        context to avoid extra round-trips. Requires `X-API-Key` header.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, verified, rejected, expired]
          description: Filter by request status
          example: pending
        - name: older_than
          in: query
          required: false
          schema:
            type: integer
          description: Only return requests older than N days
          example: 7
        - name: expired
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false"]
          description: If "true", only return requests whose token has expired
          example: "true"
      responses:
        "200":
          description: List of verification requests with embedded context
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VerificationRequestWithContext"
              examples:
                pending_expired:
                  summary: One expired-token pending request
                  value:
                    - request_id: 4
                      experience_id: 7
                      verifier_name: "Bob Jones"
                      verifier_position: "CTO"
                      verifier_email: "bob@acme.com"
                      verification_token: "b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5"
                      status: pending
                      verifier_comment: null
                      requested_at: "2026-03-01T09:00:00"
                      responded_at: null
                      expires_at: "2026-03-31T09:00:00"
                      links:
                        self: "/api/users/1/projects/42/experiences/7/verification-requests/4/"
                        experience: "/api/users/1/projects/42/experiences/7/"
                        respond: "/api/verification-requests/4/respond/"
                      context:
                        company_name: "Acme Corp"
                        position_title: "Senior Software Engineer"
                        requester_username: "johndoe"
