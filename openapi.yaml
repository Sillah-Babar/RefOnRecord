openapi: 3.0.3
info:
  title: RefOnRecord – Resume Verifier API
  description: >
    API for managing resume projects, work experiences, and verification requests.
    Verifiers can be emailed to confirm or reject employment history.
  version: "1.0.0"
  contact:
    name: PWP Spring 2026 Group
    email: Sillah.Babar@student.oulu.fi

servers:
  - url: https://refonrecord.onrender.com/api
    description: Production
  - url: http://localhost:5000/api
    description: Local development

security: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT token obtained from POST /auth/login/. Pass as
        `Authorization: Bearer <token>`. Tokens expire after 7 days.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        Machine-to-Machine API key for internal service endpoints (e.g. reminder
        service). Must be included as `X-API-Key: <key>`.

  responses:
    BadRequest:
      description: Invalid request body or validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "'email' is not a 'email'"
    Unauthorized:
      description: Missing, invalid, or expired bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Missing or invalid Authorization header"
    Forbidden:
      description: Authenticated user is not the owner of this resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Forbidden"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Resource not found"
    Conflict:
      description: Duplicate resource (e.g. email or username already in use)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Email or username already registered"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    User:
      type: object
      properties:
        user_id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: user@example.com
        username:
          type: string
          example: johndoe
        phone_number:
          type: string
          nullable: true
          example: "+358401234567"
        tier:
          type: string
          enum: [normal, premium]
          example: normal
        created_at:
          type: string
          format: date-time
          example: "2026-01-15T10:30:00"
        links:
          type: object
          properties:
            self:
              type: string
              example: "/api/users/1/"
            projects:
              type: string
              example: "/api/users/1/projects/"

    Project:
      type: object
      properties:
        project_id:
          type: integer
          example: 42
        user_id:
          type: integer
          example: 1
        project_name:
          type: string
          example: "Software Engineer Resume 2026"
        template_style:
          type: string
          enum: [classic, modern, minimal]
          example: modern
        phone_number:
          type: string
          nullable: true
          example: "+358401234567"
        linkedin_url:
          type: string
          nullable: true
          example: "https://linkedin.com/in/johndoe"
        github_url:
          type: string
          nullable: true
          example: "https://github.com/johndoe"
        personal_website:
          type: string
          nullable: true
          example: "https://johndoe.dev"
        current_company:
          type: string
          nullable: true
          example: "Acme Corp"
        is_employed:
          type: boolean
          example: true
        education_details:
          type: string
          nullable: true
          example: "B.Sc. Computer Science, University of Oulu, 2020–2024"
        created_at:
          type: string
          format: date-time
          example: "2026-01-20T09:00:00"
        updated_at:
          type: string
          format: date-time
          example: "2026-03-01T14:22:00"
        links:
          type: object
          properties:
            self:
              type: string
              example: "/api/users/1/projects/42/"
            owner:
              type: string
              example: "/api/users/1/"
            experiences:
              type: string
              example: "/api/users/1/projects/42/experiences/"
            shares:
              type: string
              example: "/api/users/1/projects/42/shares/"

    Experience:
      type: object
      properties:
        experience_id:
          type: integer
          example: 7
        project_id:
          type: integer
          example: 42
        company_name:
          type: string
          example: "Acme Corp"
        position_title:
          type: string
          example: "Senior Software Engineer"
        start_date:
          type: string
          format: date
          example: "2022-06-01"
        end_date:
          type: string
          format: date
          nullable: true
          example: "2025-12-31"
        description:
          type: string
          example: "Developed and maintained backend microservices using Python and Flask."
        verification_status:
          type: string
          enum: [not_requested, pending, verified, rejected]
          example: verified
        created_at:
          type: string
          format: date-time
          example: "2026-01-20T09:05:00"
        updated_at:
          type: string
          format: date-time
          example: "2026-02-10T11:00:00"
        links:
          type: object
          properties:
            self:
              type: string
              example: "/api/users/1/projects/42/experiences/7/"
            project:
              type: string
              example: "/api/users/1/projects/42/"
            verification_requests:
              type: string
              example: "/api/users/1/projects/42/experiences/7/verification-requests/"

    VerificationRequest:
      type: object
      properties:
        request_id:
          type: integer
          example: 3
        experience_id:
          type: integer
          example: 7
        verifier_name:
          type: string
          example: "Jane Smith"
        verifier_position:
          type: string
          example: "Engineering Manager"
        verifier_email:
          type: string
          format: email
          example: "jane.smith@acme.com"
        verification_token:
          type: string
          description: Hex token sent to the verifier by email (32-character hex string).
          example: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
        status:
          type: string
          enum: [pending, verified, rejected, expired]
          example: pending
        verifier_comment:
          type: string
          nullable: true
          example: "Confirmed — John worked on our platform team."
        requested_at:
          type: string
          format: date-time
          example: "2026-02-01T08:00:00"
        responded_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-02-03T10:15:00"
        expires_at:
          type: string
          format: date-time
          example: "2026-03-03T08:00:00"
        links:
          type: object
          properties:
            self:
              type: string
              example: "/api/users/1/projects/42/experiences/7/verification-requests/3/"
            experience:
              type: string
              example: "/api/users/1/projects/42/experiences/7/"
            respond:
              type: string
              example: "/api/verification-requests/3/respond/"

    VerificationRequestWithContext:
      allOf:
        - $ref: "#/components/schemas/VerificationRequest"
        - type: object
          properties:
            context:
              type: object
              description: >
                Embedded experience and project context returned by M2M endpoints
                so callers avoid extra round-trips.
              properties:
                company_name:
                  type: string
                  example: "Acme Corp"
                position_title:
                  type: string
                  example: "Senior Software Engineer"
                requester_username:
                  type: string
                  example: "johndoe"
                project_id:
                  type: integer
                  example: 42

    ShareLink:
      type: object
      properties:
        share_id:
          type: integer
          example: 10
        project_id:
          type: integer
          example: 42
        share_token:
          type: string
          description: Hex token used to access the public share URL (32-character hex string).
          example: "f9e8d7c6b5a4f9e8d7c6b5a4f9e8d7c6"
        recipient_email:
          type: string
          format: email
          nullable: true
          example: "recruiter@company.com"
        access_type:
          type: string
          enum: [view, edit]
          example: view
        email_subject:
          type: string
          nullable: true
          example: "My Software Engineering Resume"
        email_message:
          type: string
          nullable: true
          example: "Hi, please find my verified resume attached."
        view_count:
          type: integer
          example: 5
        created_at:
          type: string
          format: date-time
          example: "2026-03-10T12:00:00"
        expires_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-06-10T12:00:00"
        links:
          type: object
          properties:
            self:
              type: string
              example: "/api/shares/f9e8d7c6b5a4f9e8d7c6b5a4f9e8d7c6/"
            project:
              type: string
              example: "/api/users/1/projects/42/"

paths:
  # ── Authentication ──────────────────────────────────────────────────────────

  /auth/login/:
    post:
      tags: [Auth]
      summary: Login and obtain a JWT bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
            example:
              email: user@example.com
              password: secret123
      responses:
        "200":
          description: Login successful — returns a signed JWT valid for 7 days
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Signed JWT to use as Bearer token
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIn0.abc"
                  user_id:
                    type: integer
                    example: 1
                  expires_at:
                    type: string
                    format: date-time
                    example: "2026-04-12T10:00:00+00:00"
              example:
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxIn0.abc"
                user_id: 1
                expires_at: "2026-04-12T10:00:00+00:00"
        "400":
          description: Invalid or malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Request body must be JSON"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Invalid email or password"

  /auth/logout/:
    delete:
      tags: [Auth]
      summary: Logout and invalidate the current bearer token
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Logged out successfully — token is now blocklisted
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Users ───────────────────────────────────────────────────────────────────

  /users/:
    post:
      tags: [Users]
      summary: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, password]
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                username:
                  type: string
                  minLength: 3
                  maxLength: 100
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                phone_number:
                  type: string
                  maxLength: 20
                tier:
                  type: string
                  enum: [normal, premium]
            example:
              email: user@example.com
              username: johndoe
              password: securepass1
      responses:
        "201":
          description: User created
          headers:
            Location:
              schema:
                type: string
              description: URL of the created user resource
              example: "/api/users/1/"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                user_id: 1
                email: user@example.com
                username: johndoe
                phone_number: null
                tier: normal
                created_at: "2026-04-05T12:00:00"
                links:
                  self: "/api/users/1/"
                  projects: "/api/users/1/projects/"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "'password' is too short"
        "409":
          description: Email or username already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Email or username already registered"

  /users/{user_id}/:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
        example: 1
    get:
      tags: [Users]
      summary: Get a user profile (owner only)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                user_id: 1
                email: user@example.com
                username: johndoe
                phone_number: "+358401234567"
                tier: premium
                created_at: "2026-01-15T10:30:00"
                links:
                  self: "/api/users/1/"
                  projects: "/api/users/1/projects/"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Users]
      summary: Update a user profile (owner only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                username:
                  type: string
                  minLength: 3
                  maxLength: 100
                phone_number:
                  type: string
                  maxLength: 20
                tier:
                  type: string
                  enum: [normal, premium]
            example:
              tier: premium
              phone_number: "+358401234567"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                user_id: 1
                email: user@example.com
                username: johndoe
                phone_number: "+358401234567"
                tier: premium
                created_at: "2026-01-15T10:30:00"
                links:
                  self: "/api/users/1/"
                  projects: "/api/users/1/projects/"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Users]
      summary: Delete a user account and all associated data (owner only)
      security:
        - BearerAuth: []
      responses:
        "204":
          description: User deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Projects ─────────────────────────────────────────────────────────────────

  /users/{user_id}/projects/:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
        example: 1
    get:
      tags: [Projects]
      summary: List all projects for a user (owner only, cached 300s)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
              examples:
                with_projects:
                  summary: User with one project
                  value:
                    - project_id: 42
                      user_id: 1
                      project_name: "Software Engineer Resume 2026"
                      template_style: modern
                      phone_number: null
                      linkedin_url: "https://linkedin.com/in/johndoe"
                      github_url: null
                      personal_website: null
                      current_company: "Acme Corp"
                      is_employed: true
                      education_details: null
                      created_at: "2026-01-20T09:00:00"
                      updated_at: "2026-03-01T14:22:00"
                      links:
                        self: "/api/users/1/projects/42/"
                        owner: "/api/users/1/"
                        experiences: "/api/users/1/projects/42/experiences/"
                        shares: "/api/users/1/projects/42/shares/"
                empty:
                  summary: User with no projects
                  value: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Projects]
      summary: Create a new resume project (owner only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_name]
              additionalProperties: false
              properties:
                project_name:
                  type: string
                  minLength: 1
                  maxLength: 200
                template_style:
                  type: string
                  enum: [classic, modern, minimal]
                phone_number:
                  type: string
                  maxLength: 20
                linkedin_url:
                  type: string
                  maxLength: 500
                github_url:
                  type: string
                  maxLength: 500
                personal_website:
                  type: string
                  maxLength: 500
                current_company:
                  type: string
                  maxLength: 200
                is_employed:
                  type: boolean
                education_details:
                  type: string
            example:
              project_name: "Software Engineer Resume 2026"
              template_style: modern
              linkedin_url: "https://linkedin.com/in/johndoe"
              is_employed: true
      responses:
        "201":
          description: Project created
          headers:
            Location:
              schema:
                type: string
              description: URL of the created project
              example: "/api/users/1/projects/42/"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
              example:
                project_id: 42
                user_id: 1
                project_name: "Software Engineer Resume 2026"
                template_style: modern
                phone_number: null
                linkedin_url: "https://linkedin.com/in/johndoe"
                github_url: null
                personal_website: null
                current_company: null
                is_employed: true
                education_details: null
                created_at: "2026-04-05T12:00:00"
                updated_at: "2026-04-05T12:00:00"
                links:
                  self: "/api/users/1/projects/42/"
                  owner: "/api/users/1/"
                  experiences: "/api/users/1/projects/42/experiences/"
                  shares: "/api/users/1/projects/42/shares/"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{user_id}/projects/{project_id}/:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
        example: 1
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
        example: 42
    get:
      tags: [Projects]
      summary: Get a single project (owner only, cached 300s)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
              example:
                project_id: 42
                user_id: 1
                project_name: "Software Engineer Resume 2026"
                template_style: modern
                phone_number: null
                linkedin_url: "https://linkedin.com/in/johndoe"
                github_url: "https://github.com/johndoe"
                personal_website: null
                current_company: "Acme Corp"
                is_employed: true
                education_details: "B.Sc. Computer Science, University of Oulu, 2020–2024"
                created_at: "2026-01-20T09:00:00"
                updated_at: "2026-03-01T14:22:00"
                links:
                  self: "/api/users/1/projects/42/"
                  owner: "/api/users/1/"
                  experiences: "/api/users/1/projects/42/experiences/"
                  shares: "/api/users/1/projects/42/shares/"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Projects]
      summary: Update a project (owner only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                project_name:
                  type: string
                  minLength: 1
                  maxLength: 200
                template_style:
                  type: string
                  enum: [classic, modern, minimal]
                phone_number:
                  type: string
                  maxLength: 20
                linkedin_url:
                  type: string
                  maxLength: 500
                github_url:
                  type: string
                  maxLength: 500
                personal_website:
                  type: string
                  maxLength: 500
                current_company:
                  type: string
                  maxLength: 200
                is_employed:
                  type: boolean
                education_details:
                  type: string
            example:
              current_company: "New Corp"
              is_employed: true
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
              example:
                project_id: 42
                user_id: 1
                project_name: "Software Engineer Resume 2026"
                template_style: modern
                phone_number: null
                linkedin_url: "https://linkedin.com/in/johndoe"
                github_url: "https://github.com/johndoe"
                personal_website: null
                current_company: "New Corp"
                is_employed: true
                education_details: "B.Sc. Computer Science, University of Oulu, 2020–2024"
                created_at: "2026-01-20T09:00:00"
                updated_at: "2026-04-05T12:00:00"
                links:
                  self: "/api/users/1/projects/42/"
                  owner: "/api/users/1/"
                  experiences: "/api/users/1/projects/42/experiences/"
                  shares: "/api/users/1/projects/42/shares/"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Projects]
      summary: Delete a project and all associated data (owner only)
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Project deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Experiences ──────────────────────────────────────────────────────────────

  /users/{user_id}/projects/{project_id}/experiences/:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
        example: 1
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
        example: 42
    get:
      tags: [Experiences]
      summary: List all experiences in a project (owner only, cached 300s)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of experiences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Experience"
              examples:
                with_experiences:
                  summary: Project with two experiences (one current, one past)
                  value:
                    - experience_id: 7
